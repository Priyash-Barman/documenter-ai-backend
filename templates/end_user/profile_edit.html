<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Documenter AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Navigation -->
            <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
                <div class="container">
                    <a class="navbar-brand" href="/">
                        <i class="fas fa-file-alt me-2"></i>Documenter AI
                    </a>
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Home</a>
                        <a class="nav-link" href="/profile"><i class="fas fa-user me-1"></i>Profile</a>
                        <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-12" style="margin-top: 80px;">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-md-8 col-lg-6">
                            <div class="card shadow">
                                <div class="card-header bg-primary text-white">
                                    <h4 class="mb-0">
                                        <i class="fas fa-edit me-2"></i>Edit Profile
                                    </h4>
                                </div>
                                <div class="card-body">
                                    {% if error %}
                                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                        <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                    {% endif %}

                                    <div class="text-center mb-4">
                                        <div class="profile-avatar">
                                            <i class="fas fa-user-circle text-primary" style="font-size: 5rem;"></i>
                                        </div>
                                    </div>

                                    <form method="post" action="/profile/update" id="profileForm">
                                        <div class="mb-3">
                                            <label for="full_name" class="form-label">
                                                <i class="fas fa-user me-2"></i>Full Name
                                            </label>
                                            <input 
                                                type="text" 
                                                class="form-control" 
                                                id="full_name" 
                                                name="full_name" 
                                                value="{{ profile.full_name }}"
                                                required
                                                minlength="2"
                                                maxlength="100"
                                            >
                                            <div class="form-text">Enter your full name (2-100 characters)</div>
                                        </div>

                                        <div class="mb-3">
                                            <label for="email" class="form-label">
                                                <i class="fas fa-envelope me-2"></i>Email Address
                                            </label>
                                            <input 
                                                type="email" 
                                                class="form-control" 
                                                id="email" 
                                                value="{{ profile.email }}"
                                                disabled
                                            >
                                            <div class="form-text text-muted">
                                                <i class="fas fa-info-circle me-1"></i>
                                                Email cannot be changed. Contact support if needed.
                                            </div>
                                        </div>

                                        <div class="mb-4">
                                            <small class="text-muted">
                                                <i class="fas fa-clock me-1"></i>
                                                Last updated: {{ profile.updated_at.strftime('%B %d, %Y at %I:%M %p') }}
                                            </small>
                                        </div>

                                        <div class="d-grid gap-2">
                                            <button type="submit" class="btn btn-primary" id="updateBtn">
                                                <i class="fas fa-save me-2"></i>Update Profile
                                            </button>
                                            <a href="/profile" class="btn btn-outline-secondary">
                                                <i class="fas fa-times me-2"></i>Cancel
                                            </a>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form validation and enhancement
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('updateBtn');
            const fullName = document.getElementById('full_name').value.trim();
            
            // Basic validation
            if (!fullName || fullName.length < 2) {
                e.preventDefault();
                alert('Please enter a valid full name (at least 2 characters)');
                return false;
            }
            
            // Show loading state
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Updating...';
            submitBtn.disabled = true;
        });

        // Auto-dismiss alerts after 5 seconds
        setTimeout(function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                if (alert.classList.contains('show')) {
                    const bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                }
            });
        }, 5000);
    </script>
</body>
</html>
